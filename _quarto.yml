project:
  type: default
  output-dir: html_output

format:
  html:
    css: styles.css
    theme: cosmo
    toc: true
    number-sections: true
    number-depth: 2
    embed-resources: true
    code-block-bg: "#9CADC9"
    code-block-border-left: "#979BCE"
    syntax-highlighting: dracula

execute:
  echo: true
  warning: false
  message: false

jupyter: python3